schema_version: 1

context:
  name: pocean-core
  version: "3.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pocean_core-${{ version }}.tar.gz
  sha256: 2488f158b856fa369ac6d75ac91ea962415f860e7edf31ab1fd747f25c381af2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=42
    - setuptools-scm >=3.4
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - cftime >=1.2.1
    - netcdf4
    - numpy >=1.20
    - pandas >=1.0.5
    - python-dateutil
    - pytz
    - shapely >=1.8
    - simplejson

tests:
  - python:
      imports:
        - pocean
        - pocean.dsg
        - pocean.grid
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/axiom-data-science/pocean-core
  license: MIT
  license_file: LICENSE.txt
  summary: A python framework for working with met-ocean data.

extra:
  recipe-maintainers:
    - daf
    - kwilcox
    - ocefpaf
